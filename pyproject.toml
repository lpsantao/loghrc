[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loghrc"
version = "0.5.0"
description = "Labelled Occupancy Grid RL environments for Human-Robot Collaboration (Gymnasium)"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.24",
]

[project.optional-dependencies]
render = ["matplotlib>=3.7"]
train = ["sb3-contrib>=2.3", "stable-baselines3>=2.3", "torch>=2.0"]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["loghrc", "loghrc.core", "loghrc.constraints", "loghrc.humans", "loghrc.humans.profiles", "loghrc.tasks", "loghrc.tasks.furniture", "loghrc.tasks.blocks", "loghrc.viz"]

[tool.setuptools.package-data]
loghrc = ["viz/viewer/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
